# Aplikacje na Windows, macOS i Linux oraz testowy obraz karty, wystawiane w Releases.
# Każdy system ma swój numer wersji w x6100mb/assets/versions.json (Windows, macOS, Linux osobno).
# Push na main, w którym któryś numer wzrósł, robi od razu publiczne wydanie (Latest);
# bez zmiany numerów tylko budowanie i testy.
name: Build
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Wydanie: numer wersji, np. v0.1.0 (puste: tylko budowanie)"
        required: false
        default: ""

permissions:
  contents: write

# A newer push replaces an unfinished build of the branch (one release at a time); tags run to the end
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests -v

  uboot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf bison flex swig python3-dev python3-setuptools \
            python3-pyelftools libssl-dev libgnutls28-dev device-tree-compiler bc
      - name: Build U-Boot with the X6100 screen
        run: ./uboot/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-x6100-menu
          path: uboot/out/u-boot-x6100-menu.bin

  doom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf e2fsprogs unzip xz-utils
      - name: Doom for the X6100 (the Extras easter egg)
        run: ./extras/doom/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: doom-x6100-rootfs
          path: extras/doom/out/doom-x6100-rootfs.ext4.xz

  apps:
    needs: [test, uboot, doom]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: Xiegu-Multi-Patcher-Windows
            extra: --onefile --windowed --uac-admin --icon x6100mb/assets/icon.ico
          - os: macos-latest
            out: Xiegu-Multi-Patcher-macOS
            extra: --onedir --windowed --icon x6100mb/assets/icon.icns --osx-bundle-identifier eu.multipatcher.xiegu
          - os: ubuntu-22.04
            out: Xiegu-Multi-Patcher-Linux
            extra: --onefile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tk check
        run: python -c "import tkinter; print(tkinter.TkVersion)"
      - uses: actions/download-artifact@v4
        with: {name: u-boot-x6100-menu, path: x6100mb/data}
      - uses: actions/download-artifact@v4
        with: {name: doom-x6100-rootfs, path: x6100mb/data}
      - run: pip install pyinstaller==6.11.1 pillow==11.0.0 certifi sv-ttk==2.6.0
      - name: Build
        shell: bash
        run: |
          pyinstaller --noconfirm --name "Xiegu Multi Patcher" ${{ matrix.extra }} --paths . --collect-data sv_ttk \
            --add-data "x6100mb/data:x6100mb/data" --add-data "x6100mb/assets:x6100mb/assets" x6100_multiboot.py
      - name: Smoke test
        shell: bash
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          case "$RUNNER_OS" in
            macOS)   B="dist/Xiegu Multi Patcher.app/Contents/MacOS/Xiegu Multi Patcher" ;;
            Windows) B="dist/Xiegu Multi Patcher.exe" ;;
            Linux)   B="dist/Xiegu Multi Patcher" ;;
          esac
          "$B" --help || true
          if [ "$RUNNER_OS" != Windows ]; then
            "$B" build --help | grep -q -- --data
            # HTTPS from inside the packed app (macOS: no system certificates without certifi)
            "$B" catalog | tee catalog.txt
            ! grep -q "error:" catalog.txt
          fi
      - name: Pack
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp "dist/Xiegu Multi Patcher.exe" out/Xiegu-Multi-Patcher.exe ;;
            macOS)   (cd dist && ditto -c -k --keepParent "Xiegu Multi Patcher.app" ../out/Xiegu-Multi-Patcher-macOS.zip) ;;
            Linux)   cp "dist/Xiegu Multi Patcher" out/Xiegu-Multi-Patcher-Linux && chmod +x out/Xiegu-Multi-Patcher-Linux ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/

  # The app fetches the newest systems itself and builds a card from them: a check only, nothing
  # of it is published (the release carries the app; users fetch the systems they want in it)
  live-check:
    needs: [test, uboot, doom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: u-boot-x6100-menu, path: x6100mb/data}
      - uses: actions/download-artifact@v4
        with: {name: doom-x6100-rootfs, path: x6100mb/data}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Catalog (live, newest releases on GitHub)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python x6100_multiboot.py catalog
      - name: A card from the newest releases, fetched by the app (not kept)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          pip install pillow==11.0.0 certifi
          python x6100_multiboot.py build -o "$RUNNER_TEMP/check.img" --doom --xiegu --data separate --data-mb 64 \
            openx6x00@latest openx6100@latest cx8anm@latest > build.log
          tail -c 700 build.log
          grep -q "menu, ekran" build.log
          grep -q "'graphics': True" build.log
          grep -q "'name': 'DOOM'" build.log
          rm -f "$RUNNER_TEMP/check.img"

  # A public release from every push to main (the next version number), from a tag v*, or from
  # Actions > Build > Run workflow with a version number: the apps and the menu's U-Boot.
  release:
    needs: [apps, live-check, uboot, doom]
    # One app that did not build (GitHub's macOS queue) does not hold back the others
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || inputs.release_tag != '') && needs.uboot.result == 'success' && needs.live-check.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: x6100mb/assets/versions.json, sparse-checkout-cone-mode: false}
      - name: Version numbers
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          eval "$(python3 -c "import json;v=json.load(open('x6100mb/assets/versions.json'));print('W=%s M=%s L=%s' % (v['windows'], v['macos'], v['linux']))")"
          tag="${GIVEN:-win$W-mac$M-linux$L}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is out already: no version number went up, nothing to release"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          { echo "REL_TAG=$tag"; echo "VW=$W"; echo "VM=$M"; echo "VL=$L"; } >> "$GITHUB_ENV"
          echo "release: $tag"
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.skip != '1'
        with: {path: art, pattern: "Xiegu-Multi-Patcher-*", merge-multiple: true}
      - name: At least one app
        if: steps.ver.outputs.skip != '1'
        run: ls art/Xiegu-Multi-Patcher* >/dev/null
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.skip != '1'
        with: {name: u-boot-x6100-menu, path: art}
      - run: ls -la art
        if: steps.ver.outputs.skip != '1'
      - name: The interim test build goes
        if: steps.ver.outputs.skip != '1'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release delete test-build --cleanup-tag --yes -R "${{ github.repository }}" || true
      - name: Release
        if: steps.ver.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Xiegu Multi Patcher · Windows ${{ env.VW }} · macOS ${{ env.VM }} · Linux ${{ env.VL }}"
          prerelease: false
          make_latest: true
          files: art/*
          body: |
            Kilka systemów na jednej karcie SD dla Xiegu X6100, z menu na ekranie radia (F1–F5).

            **Pobierz aplikację dla swojego komputera:**
            - Windows: `Xiegu-Multi-Patcher.exe` (wersja ${{ env.VW }})
            - macOS: `Xiegu-Multi-Patcher-macOS.zip` (wersja ${{ env.VM }}) (rozpakuj; za pierwszym razem: Ustawienia systemowe → Prywatność i ochrona → Otwórz mimo to)
            - Linux: `Xiegu-Multi-Patcher-Linux` (wersja ${{ env.VL }}; `chmod +x`; do zapisu karty potrzebny pkexec)

            Systemy radia (OpenX6X00, OpenX6100, CX8ANM, 1KO125, IU1WXY, R1CBU) pobierasz w aplikacji
            przyciskiem **+ Z internetu…**, prosto z wydań ich autorów. Instrukcja: README w repozytorium.

            W sekcji **Extras** aplikacji: klasyczny Doom na radiu (Freedoom), z dźwiękiem i muzyką na głośniku radia,
            myszą i klawiaturą USB albo Bluetooth.

            Ostatnia zmiana: ${{ github.event.head_commit.message || 'zobacz historię zmian' }}

            Wcześniej: menu jak na ekranie radia już w aplikacji, motyw jasny/ciemny, polski/angielski,
            czas wyboru do 15 s albo czekanie na klawisz, klawisz POWER w menu startowym wyłącza radio.

            `u-boot-x6100-menu.bin`: U-Boot menu z obsługą ekranu X6100 (aplikacja ma go w sobie).

            Problemy zgłaszaj w Issues. Aplikacja: SQ6RT, https://www.qrz.com/db/SQ6RT
