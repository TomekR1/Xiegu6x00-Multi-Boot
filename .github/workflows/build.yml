# Aplikacje na Windows, macOS i Linux oraz testowy obraz karty, wystawiane w Releases.
# Każdy system ma swój numer wersji w x6100mb/assets/versions.json (Windows, macOS, Linux osobno).
# Push na main, w którym któryś numer wzrósł, robi od razu publiczne wydanie (Latest): każda
# aplikacja trafia do niego, gdy tylko się zbuduje; bez zmiany numerów tylko budowanie i testy.
name: Build
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Wydanie: numer wersji, np. v0.1.0 (puste: tylko budowanie)"
        required: false
        default: ""
      notes_tag:
        description: "Wydanie, którego opis napisać od nowa (z .github/publish.py; puste: nic)"
        required: false
        default: ""
      delete_tag:
        description: "Stare wydanie do usunięcia razem z tagiem (puste: nic)"
        required: false
        default: ""
      moved_tag:
        description: "Wydanie testowe do zamiany na stronę z linkiem do wydania głównego (puste: nic)"
        required: false
        default: ""

permissions:
  contents: write

# A newer push replaces an unfinished build of the branch (one release at a time); tags run to the end
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # A former test release: its files gone, a notice with the link to the main release in its place
  moved:
    if: inputs.moved_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {GH_TOKEN: "${{ github.token }}", MOVED_TAG: "${{ inputs.moved_tag }}"}
        run: python3 .github/moved.py

  # A release's description written anew (the text in .github/publish.py and WHATS-NEW.md)
  notes:
    if: inputs.notes_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {GH_TOKEN: "${{ github.token }}", NOTES_TAG: "${{ inputs.notes_tag }}", GIVEN: "${{ inputs.notes_tag }}"}
        run: python3 .github/publish.py --notes "$NOTES_TAG"

  # An old release gone, with its tag (never the newest one, nor a page pointing to it)
  delete-old:
    if: inputs.delete_tag != ''
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.delete_tag }}", REPO: "${{ github.repository }}"}
        run: |
          latest=$(gh api repos/$REPO/releases/latest --jq .tag_name)
          [ "$TAG" != "$latest" ] || { echo "$TAG is the newest release: kept"; exit 1; }
          ! gh api repos/$REPO/releases/tags/$TAG --jq .body | grep -q moved-to-main || { echo "a page pointing to the release: kept"; exit 1; }
          gh release delete "$TAG" --cleanup-tag --yes -R "$REPO"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests -v

  uboot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf bison flex swig python3-dev python3-setuptools \
            python3-pyelftools libssl-dev libgnutls28-dev device-tree-compiler bc
      - name: Build U-Boot with the X6100 screen
        run: ./uboot/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-x6100-menu
          path: uboot/out/u-boot-x6100-menu.bin

  doom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf e2fsprogs unzip xz-utils
      - name: Doom for the X6100 (the Extras easter egg)
        run: ./extras/doom/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: doom-x6100-rootfs
          path: extras/doom/out/doom-x6100-rootfs.ext4.xz

  nes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf e2fsprogs xz-utils fonts-inter python3-pil libstb-dev
      - name: The NES emulator for the X6100 (Extras; FCEUmm, no games)
        run: ./extras/nes/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nes-x6100-rootfs
          path: |
            extras/nes/out/nes-x6100-rootfs.ext4.xz
            extras/nes/out/nes-x6100-rootfs.ext4.xz.sha256
            extras/nes/out/nes-version.txt

  apps:
    needs: [test, uboot, doom, nes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: Xiegu-Multi-Patcher-Windows
            # One folder, not one self-unpacking file (Windows Defender takes those for malware)
            extra: --onedir --windowed --uac-admin --icon x6100mb/assets/icon.ico
          - os: macos-latest
            out: Xiegu-Multi-Patcher-macOS
            extra: --onedir --windowed --icon x6100mb/assets/icon.icns --osx-bundle-identifier eu.multipatcher.xiegu
          - os: ubuntu-22.04
            out: Xiegu-Multi-Patcher-Linux
            extra: --onefile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tk check
        run: python -c "import tkinter; print(tkinter.TkVersion)"
      - uses: actions/download-artifact@v4
        with: {name: u-boot-x6100-menu, path: x6100mb/data}
      - uses: actions/download-artifact@v4
        with: {name: doom-x6100-rootfs, path: x6100mb/data}
      - uses: actions/download-artifact@v4
        with: {name: nes-x6100-rootfs, path: x6100mb/data}
      - run: pip install pillow==11.0.0 certifi sv-ttk==2.6.0
      # PyInstaller's own ready-made Windows starter is in a great many programs, bad ones too, and
      # virus scanners flag it; one built here from its source is this app's own
      # The card list on a real Windows: the system disk never offered as a card
      - name: Windows disks
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          from x6100mb import devices
          cards = devices.list_cards()
          print("cards:", cards)
          disks = devices._ps("Get-Disk | Select-Object Number,IsBoot,IsSystem | ConvertTo-Json")
          disks = [disks] if isinstance(disks, dict) else disks
          sysd = {d["Number"] for d in disks if d.get("IsBoot") or d.get("IsSystem")}
          print("system disks:", sysd)
          assert sysd and all(c["number"] not in sysd for c in cards)
          PY
      - name: "PyInstaller (Windows: its starter built from source)"
        if: runner.os == 'Windows'
        shell: bash
        env: {PYINSTALLER_COMPILE_BOOTLOADER: "1"}
        run: pip install --no-binary pyinstaller pyinstaller==6.11.1
      - name: PyInstaller
        if: runner.os != 'Windows'
        run: pip install pyinstaller==6.11.1
      - name: Build
        shell: bash
        run: |
          pyinstaller --noconfirm --name "Xiegu Multi Patcher" ${{ matrix.extra }} --paths . --collect-data sv_ttk \
            --add-data "x6100mb/data:x6100mb/data" --add-data "x6100mb/assets:x6100mb/assets" x6100_multiboot.py
      - name: Smoke test
        shell: bash
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          case "$RUNNER_OS" in
            macOS)   B="dist/Xiegu Multi Patcher.app/Contents/MacOS/Xiegu Multi Patcher" ;;
            Windows) B="dist/Xiegu Multi Patcher/Xiegu Multi Patcher.exe" ;;
            Linux)   B="dist/Xiegu Multi Patcher" ;;
          esac
          "$B" --help || true
          if [ "$RUNNER_OS" != Windows ]; then
            "$B" build --help | grep -q -- --data
            # HTTPS from inside the packed app (macOS: no system certificates without certifi)
            "$B" catalog | tee catalog.txt
            ! grep -q "error:" catalog.txt
          fi
      - name: Pack
        shell: bash
        run: |
          # each package: the app and the guide in both languages next to it
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp INSTRUKCJA.html INSTRUCTIONS.html "dist/Xiegu Multi Patcher/"
                     (cd dist && 7z a -tzip -mx=7 ../out/Xiegu-Multi-Patcher-Windows.zip "Xiegu Multi Patcher" >/dev/null) ;;
            macOS)   mkdir "pkg" && mv "dist/Xiegu Multi Patcher.app" pkg/ && cp INSTRUKCJA.html INSTRUCTIONS.html pkg/
                     ditto -c -k pkg out/Xiegu-Multi-Patcher-macOS.zip ;;
            Linux)   mkdir -p "pkg/Xiegu Multi Patcher" && cp "dist/Xiegu Multi Patcher" INSTRUKCJA.html INSTRUCTIONS.html "pkg/Xiegu Multi Patcher/"
                     chmod +x "pkg/Xiegu Multi Patcher/Xiegu Multi Patcher"
                     (cd pkg && zip -q -r -X ../out/Xiegu-Multi-Patcher-Linux.zip "Xiegu Multi Patcher") ;;
          esac
          if [ "$RUNNER_OS" = Windows ]; then 7z l out/*.zip; else unzip -l out/*.zip; fi | grep -cE "INSTRUKCJA|INSTRUCTIONS" | grep -qx 2
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/
      # Straight into the newest release, marked Latest, as soon as this app is built (the others
      # do not wait for it, nor it for them); only when one of the version numbers went up
      - name: Publish
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          MSG: ${{ github.event.head_commit.message }}
        # The U-Boot from the Linux job only: two jobs putting the same file up at once clash
        # with the emulator's image for its update over the air (from the Linux job too)
        run: python .github/publish.py out/* $([ "$RUNNER_OS" = Linux ] && echo x6100mb/data/u-boot-x6100-menu.bin x6100mb/data/nes-x6100-rootfs.ext4.xz x6100mb/data/nes-x6100-rootfs.ext4.xz.sha256 x6100mb/data/nes-version.txt)

  # The app fetches the newest systems itself and builds a card from them: a check only, nothing
  # of it is published (the release carries the app; users fetch the systems they want in it)
  live-check:
    needs: [test, uboot, doom, nes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: u-boot-x6100-menu, path: x6100mb/data}
      - uses: actions/download-artifact@v4
        with: {name: doom-x6100-rootfs, path: x6100mb/data}
      - uses: actions/download-artifact@v4
        with: {name: nes-x6100-rootfs, path: x6100mb/data}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Catalog (live, newest releases on GitHub)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python x6100_multiboot.py catalog
      - name: A card from the newest releases, fetched by the app (not kept)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          pip install pillow==11.0.0 certifi
          python x6100_multiboot.py build -o "$RUNNER_TEMP/check.img" --doom --nes --data separate --data-mb 64 \
            openx6x00@latest openx6100@latest cx8anm@latest > build.log
          tail -c 700 build.log
          grep -q "menu, ekran" build.log
          grep -q "'graphics': True" build.log
          grep -q "'name': 'DOOM'" build.log
          grep -q "'name': 'NES'" build.log
          rm -f "$RUNNER_TEMP/check.img"
