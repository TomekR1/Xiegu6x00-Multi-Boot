# Aplikacje na Windows, macOS i Linux oraz testowy obraz karty, wystawiane w Releases.
# Start: tag v* (git tag v0.1.0 && git push origin v0.1.0) albo ręcznie: Actions > Build > Run workflow.
name: Build
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests -v

  uboot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf bison flex swig python3-dev python3-setuptools \
            python3-pyelftools libssl-dev libgnutls28-dev device-tree-compiler bc
      - name: Build U-Boot with the X6100 screen
        run: ./uboot/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-x6100-menu
          path: uboot/out/u-boot-x6100-menu.bin

  apps:
    needs: [test, uboot]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: Xiegu-Multi-Patcher-Windows
            extra: --onefile --windowed --uac-admin --icon x6100mb/assets/icon.ico
          - os: macos-latest
            out: Xiegu-Multi-Patcher-macOS
            extra: --onedir --windowed --icon x6100mb/assets/icon.icns --osx-bundle-identifier eu.multipatcher.xiegu
          - os: ubuntu-22.04
            out: Xiegu-Multi-Patcher-Linux
            extra: --onefile
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tk check
        run: python -c "import tkinter; print(tkinter.TkVersion)"
      - uses: actions/download-artifact@v4
        with: {name: u-boot-x6100-menu, path: x6100mb/data}
      - run: pip install pyinstaller==6.11.1 pillow==11.0.0
      - name: Build
        shell: bash
        run: |
          pyinstaller --noconfirm --name "Xiegu Multi Patcher" ${{ matrix.extra }} --paths . \
            --add-data "x6100mb/data:x6100mb/data" --add-data "x6100mb/assets:x6100mb/assets" x6100_multiboot.py
      - name: Smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   B="dist/Xiegu Multi Patcher.app/Contents/MacOS/Xiegu Multi Patcher" ;;
            Windows) B="dist/Xiegu Multi Patcher.exe" ;;
            Linux)   B="dist/Xiegu Multi Patcher" ;;
          esac
          "$B" --help || true
          if [ "$RUNNER_OS" != Windows ]; then "$B" build --help | grep -q -- --data; fi
      - name: Pack
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp "dist/Xiegu Multi Patcher.exe" out/Xiegu-Multi-Patcher.exe ;;
            macOS)   (cd dist && ditto -c -k --keepParent "Xiegu Multi Patcher.app" ../out/Xiegu-Multi-Patcher-macOS.zip) ;;
            Linux)   cp "dist/Xiegu Multi Patcher" out/Xiegu-Multi-Patcher-Linux && chmod +x out/Xiegu-Multi-Patcher-Linux ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/

  test-image:
    needs: [test, uboot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: u-boot-x6100-menu, path: x6100mb/data}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Catalog (live, newest releases on GitHub)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python x6100_multiboot.py catalog
      - name: Build test cards from the newest releases (fetched by the app itself)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          pip install pillow==11.0.0
          python x6100_multiboot.py build -o X6100-multiboot-TEST.img --xiegu --data separate --data-mb 256 \
            openx6x00@latest openx6100@latest > build.log
          tail -c 700 build.log
          grep -q "menu, ekran" build.log
          grep -q "'graphics': True" build.log
          python x6100_multiboot.py build -o X6100-multiboot-TEST-mini.img --xiegu --data-mb 128 openx6x00@latest > /dev/null
          xz -T0 -9 X6100-multiboot-TEST.img X6100-multiboot-TEST-mini.img
          sha256sum X6100-multiboot-TEST*.img.xz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: X6100-multiboot-TEST
          path: |
            X6100-multiboot-TEST.img.xz
            X6100-multiboot-TEST-mini.img.xz
            SHA256SUMS.txt
          compression-level: 0

  release:
    needs: [apps, test-image, uboot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: art, merge-multiple: true}
      - name: Replace the previous test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release delete test-build --cleanup-tag --yes -R "${{ github.repository }}" || true
      - run: ls -la art
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'test-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Wersja testowa (z gałęzi main)' }}
          prerelease: true
          make_latest: true
          files: art/*
          body: |
            **Wersja testowa, nie była jeszcze uruchamiana na radiu.**

            Aplikacje:
            - Windows: `Xiegu-Multi-Patcher.exe`
            - macOS: `Xiegu-Multi-Patcher-macOS.zip` (rozpakuj; przy pierwszym uruchomieniu prawy klik > Otwórz)
            - Linux: `Xiegu-Multi-Patcher-Linux` (`chmod +x`, do zapisu karty potrzebny pkexec)

            Karty testowe (wgraj balenaEtcherem bez rozpakowywania):
            - `X6100-multiboot-TEST.img.xz`: F1 najnowszy OpenX6X00, F2 najnowszy OpenX6100, F3 Xiegu z eMMC (osobne DATA)
            - `X6100-multiboot-TEST-mini.img.xz`: F1 najnowszy OpenX6X00, F2 Xiegu z eMMC

            Karty mają własny U-Boot z obsługą ekranu X6100 (`u-boot-x6100-menu.bin`), więc menu
            jest widoczne. eMMC nie jest zmieniane.

            Bez wciśnięcia klawisza po 5 s startuje F1.
